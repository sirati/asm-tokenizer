[build-system]
requires      = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name            = "dedup-hashmap"
version         = "0.2.0"
description     = "Macro-generated PyO3 hashmaps over the Cartesian product of integer key types and integer/float value types, with numpy-batched lookup and insert."
requires-python = ">=3.12"
license         = { text = "Apache-2.0" }
authors         = [{ name = "sirati" }]

[tool.maturin]
# Rust extension lands as ``dedup_hashmap._native``; the pure-Python
# wrapper layer (typed-IntEnum facade) lives in
# ``python/dedup_hashmap/__init__.py`` alongside it.
module-name   = "dedup_hashmap._native"
python-source = "python"
features      = ["pyo3/extension-module"]
