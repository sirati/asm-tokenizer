[package]
name = "dedup-hashmap"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Macro-generated PyO3 hashmaps over the Cartesian product of integer key types and integer/float value types, with numpy-batched lookup and insert."

[lib]
# Rust extension is shipped as the ``_native`` submodule of the
# ``dedup_hashmap`` Python package so the pure-Python wrapper layer can
# live alongside it in ``python/dedup_hashmap/``. See ``pyproject.toml``
# ``[tool.maturin]`` for the matching ``module-name`` and
# ``python-source`` settings.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# ``extension-module`` is enabled via pyproject's
# ``[tool.maturin] features = ["pyo3/extension-module"]`` for the wheel
# build (it suppresses the libpython link, which the loaded-into-CPython
# extension wants). It is NOT a default feature here: a ``cargo test``
# harness is an ordinary binary that must resolve the CPython symbols, so
# leaving the link suppression opt-in is what lets the in-crate unit
# tests build + run under ``nix develop``.
pyo3 = { version = "0.28" }
numpy = "0.28"
hashbrown = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
