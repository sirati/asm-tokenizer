[package]
name = "dedup-hashmap"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Macro-generated PyO3 hashmaps over the Cartesian product of integer key types and integer/float value types, with numpy-batched lookup and insert."

[lib]
# Rust extension is shipped as the ``_native`` submodule of the
# ``dedup_hashmap`` Python package so the pure-Python wrapper layer can
# live alongside it in ``python/dedup_hashmap/``. See ``pyproject.toml``
# ``[tool.maturin]`` for the matching ``module-name`` and
# ``python-source`` settings.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
hashbrown = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
